<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>e-dumper One Liner Q</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #ffffff;
            color: #1a1a2e;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            background: #f5f5f5;
            padding: 16px max(24px, env(safe-area-inset-right)) 16px max(24px, env(safe-area-inset-left));
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e94560;
        }

        .header h1 {
            font-size: 24px;
            color: #e94560;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1::before {
            content: '💬';
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background: #ff6b8a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #1a1a2e;
            border: 1px solid #e94560;
        }

        .btn-secondary:hover {
            background: #1a1a2e;
            color: white;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.96);
            filter: brightness(0.9);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            pointer-events: none;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 3px max(24px, env(safe-area-inset-right)) 3px max(24px, env(safe-area-inset-left));
            background: #f5f5f5;
            border-bottom: 2px solid #e94560;
            flex-wrap: wrap;
        }

        .controls-bar .btn {
            flex: 1 1 0;
        }

        .controls-bar .doc-btn {
            flex: 0.5 1 0;
        }

        .controls-bar input[type="file"] {
            display: none;
        }

        .voice-select-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .voice-select-wrapper label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            white-space: nowrap;
        }

        .voice-select-wrapper select {
            padding: 8px 10px;
            border: 1px solid #e94560;
            border-radius: 6px;
            font-size: 13px;
            background: white;
            color: #1a1a2e;
            cursor: pointer;
            min-height: 44px;
        }

        .voice-toggle {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            white-space: nowrap;
            flex: none;
            padding: 6px 12px;
            border: 1px solid #e94560;
            border-radius: 6px;
            background: white;
            min-height: 44px;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s, color 0.2s;
        }

        .voice-toggle:hover {
            background: #fdf0f3;
        }

        .voice-toggle input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #e94560;
            flex-shrink: 0;
        }

        .voice-toggle:has(input:disabled) {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left));
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #00d9a5);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .one-liner-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 24px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            text-align: left;
            user-select: none;
            -webkit-user-select: none;
        }

        .one-liner-text {
            font-size: 32px;
            font-weight: 600;
            color: #1a1a2e;
            text-align: left;
            width: 100%;
            line-height: 1.5;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            text-align: center;
            color: #666;
        }

        .empty-state h2 {
            font-size: 28px;
            margin-bottom: 16px;
            color: #1a1a2e;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 24px;
        }

        .hidden {
            display: none !important;
        }

        .navigation-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 32px;
        }

        .nav-btn {
            min-width: 120px;
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            max-width: 320px;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .toast-success { background: #00a87d; }
        .toast-error   { background: #e94560; }
        .toast-info    { background: #1a1a2e; }

        .top-bars {
            overflow: hidden;
            max-height: 300px;
            transition: max-height 0.35s ease;
        }

        .top-bars.collapsed {
            max-height: 0;
        }

        .collapse-btn {
            flex: none !important;
            margin-left: auto;
            padding: 8px 28px;
            background: #e94560;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            line-height: 1;
            align-self: center;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 48px;
            min-width: 110px;
        }

        .collapse-btn:hover {
            background: #c73652;
        }

        .collapse-btn:active {
            transform: scale(0.97);
        }

        .collapse-btn svg {
            flex-shrink: 0;
        }

        .expand-fab {
            position: fixed;
            top: 0;
            right: max(16px, env(safe-area-inset-right));
            z-index: 1000;
            padding: 4px 14px 6px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 0 0 8px 8px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            display: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .expand-fab.visible {
            display: block;
        }

        @media (max-width: 768px) {
            .controls-bar {
                padding: 3px max(10px, env(safe-area-inset-right)) 3px max(10px, env(safe-area-inset-left));
                gap: 8px;
            }

            /* Voice selector takes its own full row */
            .voice-select-wrapper {
                flex: 1 1 100%;
                width: 100%;
            }

            .voice-select-wrapper select {
                flex: 1;
                width: 100%;
            }

            /* Buttons and voice toggle fill two per row */
            .controls-bar .btn,
            .voice-toggle {
                flex: 1 1 calc(50% - 4px);
            }

            .main-container {
                padding: 12px max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left));
            }

            .one-liner-card {
                padding: 20px;
                min-height: 150px;
            }

            .one-liner-text {
                font-size: 20px;
            }

            .navigation-buttons {
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 16px;
            }

            .navigation-buttons .btn {
                flex: 1 1 calc(50% - 5px);
                min-width: 100px;
            }

            .progress-section {
                margin-bottom: 12px;
            }

            .header h1 {
                font-size: 18px;
            }

            .empty-state h2 {
                font-size: 20px;
            }

            .toast-container {
                bottom: max(16px, env(safe-area-inset-bottom));
                right: 16px;
                left: 16px;
            }

            .toast {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .one-liner-text {
                font-size: 18px;
            }

            .navigation-buttons .btn {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <div class="top-bars" id="topBars">
        <header class="header">
            <h1>e-dumper One Liner Q <span style="font-size: 14px; color: #666;">v2.2</span></h1>
        </header>

        <div class="controls-bar">
            <input type="file" id="oneLinerFileInput" accept=".txt">
            <button class="btn btn-primary" onclick="document.getElementById('oneLinerFileInput').click()">
                📂 Import Text
            </button>
            <div class="voice-select-wrapper">
                <label for="voiceSelect">🔊 Voice</label>
                <select id="voiceSelect" onchange="app.onVoiceChange()">
                    <option value="">— select a voice —</option>
                </select>
            </div>
            <label class="voice-toggle">
                <input type="checkbox" id="voiceCheckbox" checked onchange="app.onVoiceToggle()">
                Voice
            </label>
            <label class="voice-toggle">
                <input type="checkbox" id="shuffleCheckbox" onchange="app.onShuffleToggle()" disabled>
                🔀 Shuffle
            </label>
            <button class="btn btn-secondary" id="clearStateBtn" onclick="app.clearAndReset()">
                🗑️ Clear Progress
            </button>
            <button class="btn btn-secondary doc-btn" onclick="window.open('README-oneline-q.html', '_blank')">
                📖 Documentation
            </button>
            <button class="collapse-btn" onclick="app.toggleBars()" title="Hide toolbar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
                Hide Bar
            </button>
        </div>
    </div>

    <button class="expand-fab" id="expandFab" onclick="app.toggleBars()" title="Show toolbar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <div class="main-container">
        <div id="emptyState" class="empty-state">
            <h2>Welcome to e-dumper One Liner Q</h2>
            <p>Import a text file to get started using the Import Text button above.</p>
        </div>

        <div id="oneLinerArea" class="hidden">
            <div class="progress-section">
                <div class="progress-text">
                    <span id="oneLinerProgressText">Line 0 of 0</span>
                    <span id="oneLinerProgressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="oneLinerProgressFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="one-liner-card">
                <div class="one-liner-text" id="oneLinerText">No text loaded</div>
            </div>

            <div class="navigation-buttons">
                <button class="btn btn-secondary nav-btn" id="oneLinerPrevBtn" onclick="app.prevOneLiner()">
                    ← Previous
                </button>
                <button class="btn btn-secondary nav-btn" onclick="app.speakLine(app.oneLinerLines[app.oneLinerIndex])">
                    🔊 Replay
                </button>
                <button class="btn btn-primary nav-btn" id="oneLinerNextBtn" onclick="app.nextOneLiner()">
                    Next →
                </button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const app = {
            oneLinerLines: [],
            originalLines: [],
            oneLinerIndex: 0,

            showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            },

            saveState() {
                try {
                    const state = {
                        lines: app.oneLinerLines,
                        originalLines: app.originalLines,
                        index: app.oneLinerIndex
                    };
                    localStorage.setItem('edumperOneLinerState', JSON.stringify(state));
                } catch (e) {
                    console.warn('Could not save state:', e);
                }
            },

            loadState() {
                try {
                    const saved = localStorage.getItem('edumperOneLinerState');
                    if (!saved) return false;

                    const state = JSON.parse(saved);

                    if (state.lines && state.lines.length > 0) {
                        app.oneLinerLines = state.lines;
                        app.originalLines = state.originalLines || [...state.lines];
                        app.oneLinerIndex = state.index || 0;
                        app.renderOneLinerCard(true); // silent on load — no user interaction yet
                    }

                    return true;
                } catch (e) {
                    console.warn('Could not load state:', e);
                    return false;
                }
            },

            clearState() {
                try {
                    localStorage.removeItem('edumperOneLinerState');
                } catch (e) {
                    console.warn('Could not clear state:', e);
                }
            },

            clearAndReset() {
                if (confirm('Are you sure you want to clear all saved progress? This cannot be undone.')) {
                    app.clearState();
                    location.reload();
                }
            },

            init() {
                if (window.speechSynthesis) {
                    speechSynthesis.onvoiceschanged = app.populateVoices;
                    app.populateVoices(); // populate immediately if already loaded (Firefox)
                }

                document.getElementById('oneLinerFileInput').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onerror = () => {
                            app.showToast('Error reading file. Please try again.', 'error');
                        };
                        reader.onload = (event) => {
                            app.loadOneLiner(event.target.result);
                        };
                        reader.readAsText(file);
                    }
                });

                document.addEventListener('keydown', (e) => {
                    const oneLinerArea = document.getElementById('oneLinerArea');
                    if (oneLinerArea.classList.contains('hidden')) return;

                    if (e.key === 'ArrowRight' || e.key === 'n') {
                        app.nextOneLiner();
                    } else if (e.key === 'ArrowLeft' || e.key === 'p') {
                        app.prevOneLiner();
                    }
                });

                let touchStartX = 0;
                let touchStartY = 0;
                const card = document.getElementById('oneLinerArea');
                card.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });
                card.addEventListener('touchend', (e) => {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
                    if (dx < 0) app.nextOneLiner();
                    else app.prevOneLiner();
                }, { passive: true });
            },

            loadOneLiner(content) {
                try {
                    const lines = content.split('\n');
                    app.oneLinerLines = [];
                    app.oneLinerIndex = 0;

                    for (let line of lines) {
                        line = line.trim();
                        if (line) {
                            app.oneLinerLines.push(line);
                        }
                    }

                    if (app.oneLinerLines.length > 0) {
                        app.originalLines = [...app.oneLinerLines];
                        app.showToast(`Loaded ${app.oneLinerLines.length} lines`, 'success');
                        document.getElementById('emptyState').classList.add('hidden');
                        document.getElementById('oneLinerArea').classList.remove('hidden');
                        app.renderOneLinerCard();
                        app.saveState();
                    } else {
                        app.showToast('No text found in file.', 'error');
                    }
                } catch (e) {
                    console.error('Error loading one liner:', e);
                    app.showToast('Error loading text file.', 'error');
                }
            },

            onVoiceToggle() {
                const enabled = document.getElementById('voiceCheckbox').checked;
                if (!enabled) {
                    window.speechSynthesis && window.speechSynthesis.cancel();
                } else if (app.oneLinerLines.length > 0) {
                    app.speakLine(app.oneLinerLines[app.oneLinerIndex]);
                }
            },

            speakLine(text) {
                if (!window.speechSynthesis) return;
                if (!document.getElementById('voiceCheckbox').checked) return;
                window.speechSynthesis.cancel();
                // setTimeout avoids Chrome's cancel+speak race condition
                setTimeout(() => {
                    const utt = new SpeechSynthesisUtterance(text);
                    const savedVoiceName = localStorage.getItem('edumperSelectedVoice');
                    if (savedVoiceName) {
                        const voice = speechSynthesis.getVoices().find(v => v.name === savedVoiceName);
                        if (voice) utt.voice = voice;
                    }
                    utt.onerror = e => console.warn('TTS error:', e.error);
                    window.speechSynthesis.speak(utt);
                }, 100);
            },

            populateVoices() {
                const voices = speechSynthesis.getVoices();
                if (voices.length === 0) return;
                const select = document.getElementById('voiceSelect');
                const saved = localStorage.getItem('edumperSelectedVoice');
                select.innerHTML = '<option value="">— select a voice —</option>';
                voices.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.textContent = `${v.name} (${v.lang})${v.localService ? '' : ' ☁'}`;
                    if (v.name === saved) opt.selected = true;
                    select.appendChild(opt);
                });
            },

            onVoiceChange() {
                const name = document.getElementById('voiceSelect').value;
                if (name) {
                    localStorage.setItem('edumperSelectedVoice', name);
                } else {
                    localStorage.removeItem('edumperSelectedVoice');
                }
            },

            renderOneLinerCard(silent = false) {
                if (app.oneLinerLines.length === 0) return;

                const line = app.oneLinerLines[app.oneLinerIndex];
                document.getElementById('oneLinerText').textContent = line;

                document.getElementById('oneLinerProgressText').textContent =
                    `Line ${app.oneLinerIndex + 1} of ${app.oneLinerLines.length}`;
                document.getElementById('oneLinerProgressPercent').textContent =
                    `${Math.round(((app.oneLinerIndex + 1) / app.oneLinerLines.length) * 100)}%`;
                document.getElementById('oneLinerProgressFill').style.width =
                    `${Math.round(((app.oneLinerIndex + 1) / app.oneLinerLines.length) * 100)}%`;

                document.getElementById('oneLinerPrevBtn').disabled = app.oneLinerIndex === 0;
                document.getElementById('oneLinerNextBtn').disabled = app.oneLinerIndex === app.oneLinerLines.length - 1;

                document.getElementById('shuffleCheckbox').disabled = false;

                if (!silent) app.speakLine(line);
            },

            nextOneLiner() {
                if (app.oneLinerIndex < app.oneLinerLines.length - 1) {
                    app.oneLinerIndex++;
                    app.renderOneLinerCard();
                    app.saveState();
                }
            },

            prevOneLiner() {
                if (app.oneLinerIndex > 0) {
                    app.oneLinerIndex--;
                    app.renderOneLinerCard();
                    app.saveState();
                }
            },

            toggleBars() {
                const topBars = document.getElementById('topBars');
                const fab = document.getElementById('expandFab');
                topBars.classList.toggle('collapsed');
                fab.classList.toggle('visible');
            },

            onShuffleToggle() {
                if (app.oneLinerLines.length === 0) return;
                const checked = document.getElementById('shuffleCheckbox').checked;
                if (checked) {
                    for (let i = app.oneLinerLines.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [app.oneLinerLines[i], app.oneLinerLines[j]] = [app.oneLinerLines[j], app.oneLinerLines[i]];
                    }
                    app.showToast('Lines shuffled', 'success');
                } else {
                    app.oneLinerLines = [...app.originalLines];
                    app.showToast('Original order restored', 'info');
                }
                app.oneLinerIndex = 0;
                app.renderOneLinerCard();
                app.saveState();
            },
        };

        app.init();
        app.loadState();
    </script>
</body>
</html>
