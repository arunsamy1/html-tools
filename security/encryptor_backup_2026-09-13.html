<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Tools</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha3/0.9.3/sha3.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      background: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #1e293b;
    }

    .card {
      width: 100%;
      max-width: 1000px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.5rem 2rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 0.5rem;
    }

    textarea {
      width: 100%;
      padding: 0.4rem 0.75rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      color: #1e293b;
      font-size: 0.9rem;
      font-family: inherit;
      resize: vertical;
      min-height: 56px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    textarea:focus {
      border-color: #94a3b8;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.2);
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.75rem;
      margin-bottom: 1.25rem;
    }

    button {
      padding: 0.65rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: #1e293b;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #334155;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .btn-decrypt {
      background: #0f766e;
      color: #fff;
    }

    .btn-decrypt:hover:not(:disabled) {
      background: #0d9488;
    }

    /* --- internal divider (within a section) --- */
    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 1.25rem 0;
    }

    /* --- section separator between the two tools --- */
    .section-sep {
      border: none;
      border-top: 2px solid #cbd5e1;
      margin: 1.5rem 0;
    }

    /* SHA result */
    .result-section {
      display: none;
    }

    .result-section.visible {
      display: block;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: #f1f5f9;
      color: #475569;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
    }

    .copy-btn {
      background: transparent;
      color: #64748b;
      border: 1px solid #e2e8f0;
      padding: 0.3rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 6px;
    }

    .copy-btn:hover {
      color: #1e293b;
      border-color: #94a3b8;
    }

    .copy-btn.copied {
      color: #16a34a;
      border-color: #16a34a;
    }

    .hash-output {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 0.8rem;
      color: #334155;
      word-break: break-all;
      line-height: 1.6;
      min-height: 36px;
    }

    .meta {
      margin-top: 0.75rem;
      display: flex;
      gap: 1.5rem;
    }

    .meta-item {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .meta-item span {
      color: #64748b;
      font-weight: 600;
    }

    /* AES — file drop */
    .drop-zone {
      width: 100%;
      min-height: 60px;
      border: 2px dashed #e2e8f0;
      border-radius: 10px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      padding: 0.6rem 1rem;
      text-align: center;
      background: #f8fafc;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #94a3b8;
      background: #f1f5f9;
    }

    .drop-zone.has-file {
      border-color: #1e293b;
      border-style: solid;
    }

    .drop-icon {
      font-size: 1.25rem;
      line-height: 1;
      color: #94a3b8;
    }

    .drop-text {
      font-size: 0.9rem;
      color: #64748b;
    }

    .drop-text strong {
      color: #1e293b;
    }

    .file-info {
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.75rem;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-top: 0.5rem;
    }

    .file-info.visible {
      display: flex;
    }

    .file-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .file-details {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 0.875rem;
      font-weight: 600;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.1rem;
    }

    .remove-file {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.2rem;
      line-height: 1;
      flex-shrink: 0;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .remove-file:hover {
      color: #ef4444;
    }

    /* AES — password */
    .password-wrap {
      position: relative;
      margin-bottom: 1.25rem;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.4rem 3rem 0.4rem 0.75rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      color: #1e293b;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #94a3b8;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.2);
    }

    input::placeholder {
      color: #94a3b8;
    }

    .toggle-pw {
      position: absolute;
      right: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0;
      transition: color 0.2s;
    }

    .toggle-pw:hover {
      color: #475569;
    }

    /* AES — status */
    .status {
      display: none;
      margin-top: 1.25rem;
      padding: 0.875rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      align-items: center;
      gap: 0.6rem;
    }

    .status.visible {
      display: flex;
    }

    .status.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .status.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .status.working {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #cbd5e1;
      border-top-color: #475569;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-note {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.6;
    }

    .info-note strong {
      color: #64748b;
    }

  </style>
</head>
<body>
  <div class="card">

    <!-- ===== File Picker ===== -->
    <div style="display:flex;align-items:center;gap:0.75rem">
      <label style="margin:0;white-space:nowrap">Iterations</label>
      <input type="number" id="hashIterations" value="1" min="1" max="100000"
             style="width:90px;padding:0.4rem 0.5rem"
             oninput="onHashInput()" onchange="onHashInput()">
      <div class="drop-zone" id="hashDropZone" style="flex:1;margin:0" onclick="document.getElementById('hashFileInput').click()">
        <div class="drop-icon">&#128196;</div>
        <div class="drop-text"><strong>Click to choose</strong> or drag &amp; drop a file</div>
      </div>
    </div>
    <input type="file" id="hashFileInput" style="display:none">
    <div class="file-info" id="hashFileInfo" style="margin-top:0.5rem;margin-bottom:1.25rem">
      <div class="file-icon">&#128196;</div>
      <div class="file-details">
        <div class="file-name" id="hashFileName"></div>
        <div class="file-size" id="hashFileSize"></div>
      </div>
      <button class="remove-file" onclick="clearHashFile()" title="Remove file">&#10005;</button>
    </div>

    <div style="display:none">
      <textarea id="inputText" oninput="onHashInput()"></textarea>
      <div id="resultSection"></div>
    </div>

    <div style="display:none">
      <input type="password" id="aesPassword">
      <div id="passwordDisplay"></div>
      <button class="toggle-pw" type="button" onclick="togglePassword()"></button>
    </div>

    <hr class="section-sep">

    <div class="controls">
      <button class="btn-primary" id="encryptBtn" onclick="encryptFile()" disabled>Encrypt &amp; Download</button>
      <button class="btn-decrypt" id="decryptBtn" onclick="decryptFile()" disabled>Decrypt &amp; Download</button>
      <button class="btn-secondary" onclick="clearAes()">Clear</button>
    </div>

    <div class="status" id="aesStatus"></div>

  </div>

  <script>
    // ========================
    // Hash File Picker Section
    // ========================

    document.getElementById('hashFileInput').addEventListener('change', e => {
      if (e.target.files[0]) setHashFile(e.target.files[0]);
    });

    const hashDropZone = document.getElementById('hashDropZone');

    hashDropZone.addEventListener('dragover', e => {
      e.preventDefault();
      hashDropZone.classList.add('dragover');
    });

    hashDropZone.addEventListener('dragleave', () => hashDropZone.classList.remove('dragover'));

    hashDropZone.addEventListener('drop', e => {
      e.preventDefault();
      hashDropZone.classList.remove('dragover');
      if (e.dataTransfer.files[0]) setHashFile(e.dataTransfer.files[0]);
    });

    function setHashFile(file) {
      selectedFile = file;
      const nameWithoutExt = file.name.replace(/\.[^.]+$/, '');
      document.getElementById('hashFileName').textContent = file.name;
      document.getElementById('hashFileSize').textContent = formatSize(file.size);
      document.getElementById('hashFileInfo').classList.add('visible');
      hashDropZone.classList.add('has-file');
      document.getElementById('inputText').value = nameWithoutExt;
      computeHash();
    }

    function clearHashFile() {
      selectedFile = null;
      document.getElementById('hashFileInput').value = '';
      document.getElementById('hashFileInfo').classList.remove('visible');
      hashDropZone.classList.remove('has-file');
      document.getElementById('hashIterations').value = '1';
      document.getElementById('inputText').value = '';
      currentHash = '';
      document.getElementById('aesPassword').value = '';
      document.getElementById('passwordDisplay').style.display = 'none';
      document.querySelector('.toggle-pw').textContent = 'Show';
      updateEncryptBtn();
      hideAesStatus();
    }

    // =====================
    // SHA3-512 Hash Section
    // =====================

    let currentHash = '';

    function onHashInput() {
      const text = document.getElementById('inputText').value;
      if (text.length > 0) {
        computeHash();
      } else {
        document.getElementById('resultSection').classList.remove('visible');
      }
    }

    function computeHash() {
      const text = document.getElementById('inputText').value;
      if (!text) return;

      const iterations = Math.max(1, parseInt(document.getElementById('hashIterations').value, 10) || 1);

      let value = text;

      for (let i = 0; i < iterations; i++) {
        const hex = sha3_512(value);
        const bytes = new Uint8Array(hex.match(/.{2}/g).map(b => parseInt(b, 16)));
        value = btoa(String.fromCharCode(...bytes));
      }

      currentHash = value;

      document.getElementById('aesPassword').value = currentHash;
      updateEncryptBtn();
    }

    function clearHash() {
      document.getElementById('inputText').value = '';
      document.getElementById('resultSection').classList.remove('visible');
      document.getElementById('hashIterations').value = '1';
      currentHash = '';
      document.getElementById('aesPassword').value = '';
      document.getElementById('passwordDisplay').style.display = 'none';
      document.querySelector('.toggle-pw').textContent = 'Show';
      updateEncryptBtn();
    }

    function copyHash() {
      if (!currentHash) return;
      navigator.clipboard.writeText(currentHash).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    document.getElementById('inputText').addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') computeHash();
    });

    // ========================
    // AES-256 Encrypt Section
    // ========================

    let selectedFile = null;

    document.getElementById('aesPassword').addEventListener('input', updateEncryptBtn);

    function updateEncryptBtn() {
      const ready = selectedFile && document.getElementById('aesPassword').value.length > 0;
      document.getElementById('encryptBtn').disabled = !ready;
      document.getElementById('decryptBtn').disabled = !ready;
    }

    function togglePassword() {
      const display = document.getElementById('passwordDisplay');
      const btn = document.querySelector('.toggle-pw');
      if (display.style.display === 'none') {
        display.textContent = document.getElementById('aesPassword').value;
        display.style.display = 'block';
        btn.textContent = 'Hide';
      } else {
        display.style.display = 'none';
        btn.textContent = 'Show';
      }
    }

    async function encryptFile() {
      if (!selectedFile) return;
      const password = document.getElementById('aesPassword').value;
      if (!password) return;

      showAesStatus('working', 'Encrypting\u2026');
      document.getElementById('encryptBtn').disabled = true;

      try {
        const fileBytes = await readFileAsBytes(selectedFile);

        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv   = crypto.getRandomValues(new Uint8Array(12));

        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(password),
          'PBKDF2',
          false,
          ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt']
        );

        const encrypted = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          fileBytes
        );

        // Layout: [salt 16B][iv 12B][ciphertext]
        const output = new Uint8Array(16 + 12 + encrypted.byteLength);
        output.set(salt, 0);
        output.set(iv, 16);
        output.set(new Uint8Array(encrypted), 28);

        const outName = encryptedFileName(selectedFile.name);
        triggerDownload(output, outName);

        showAesStatus('success', `Encrypted successfully \u2014 downloading as <strong>${outName}</strong>`);
      } catch (err) {
        showAesStatus('error', 'Encryption failed: ' + err.message);
      } finally {
        updateEncryptBtn();
      }
    }

    async function decryptFile() {
      if (!selectedFile) return;
      const password = document.getElementById('aesPassword').value;
      if (!password) return;

      showAesStatus('working', 'Decrypting\u2026');
      document.getElementById('encryptBtn').disabled = true;
      document.getElementById('decryptBtn').disabled = true;

      try {
        const fileBytes = await readFileAsBytes(selectedFile);

        if (fileBytes.byteLength < 28) {
          throw new Error('File is too small to be a valid encrypted file');
        }

        // Layout: [salt 16B][iv 12B][ciphertext]
        const salt       = fileBytes.slice(0, 16);
        const iv         = fileBytes.slice(16, 28);
        const ciphertext = fileBytes.slice(28);

        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(password),
          'PBKDF2',
          false,
          ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          key,
          ciphertext
        );

        const outName = decryptedFileName(selectedFile.name);
        triggerDownload(new Uint8Array(decrypted), outName);

        showAesStatus('success', `Decrypted successfully \u2014 downloading as <strong>${outName}</strong>`);
      } catch (err) {
        const msg = err.name === 'OperationError'
          ? 'Decryption failed \u2014 wrong password or corrupted file'
          : 'Decryption failed: ' + err.message;
        showAesStatus('error', msg);
      } finally {
        updateEncryptBtn();
      }
    }

    function clearAes() {
      hideAesStatus();
    }

    function encryptedFileName(name) {
      const dot = name.lastIndexOf('.');
      if (dot > 0) return name.slice(0, dot) + '_enc' + name.slice(dot);
      return name + '_enc';
    }

    function decryptedFileName(name) {
      const dot = name.lastIndexOf('.');
      const base = dot > 0 ? name.slice(0, dot) : name;
      const ext  = dot > 0 ? name.slice(dot) : '';
      const stripped = base.endsWith('_enc') ? base.slice(0, -4) : base + '_dec';
      return stripped + ext;
    }

    function readFileAsBytes(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(new Uint8Array(e.target.result));
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsArrayBuffer(file);
      });
    }

    function triggerDownload(bytes, filename) {
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(2) + ' MB';
    }

    function showAesStatus(type, html) {
      const el = document.getElementById('aesStatus');
      el.className = 'status visible ' + type;
      el.innerHTML = type === 'working'
        ? '<div class="spinner"></div>' + html
        : html;
    }

    function hideAesStatus() {
      document.getElementById('aesStatus').className = 'status';
    }
  </script>
</body>
</html>
