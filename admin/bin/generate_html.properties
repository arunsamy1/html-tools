# Configuration for generate_html.sh
#
# html.dir     Folder holding the HTML files to index. The generated index page is
#              written into this folder. Either an absolute path, or a path
#              relative to this properties file.
#
# output.file  Name of the generated index page, written inside html.dir.
#              Defaults to index.html when left unset.
#
# Override the properties file location with the GENERATE_HTML_PROPERTIES env var.

html.dir=/opt_html
output.file=index.html
