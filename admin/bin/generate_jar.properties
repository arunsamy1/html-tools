# Configuration for generate_jar.sh
#
# jar.dir      Folder holding the JAR files to index. The generated index page is
#              written into this folder. Either an absolute path, or a path
#              relative to this properties file.
#
# output.file  Name of the generated index page, written inside jar.dir.
#              Defaults to index_jar.html when left unset. Do not point this at a
#              name another generate_*.sh writes into the same folder, or the
#              scripts will overwrite each other.
#
# Override the properties file location with the GENERATE_JAR_PROPERTIES env var.

jar.dir=/opt_jars
output.file=index_jar.html
