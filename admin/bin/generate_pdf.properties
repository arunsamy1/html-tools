# Configuration for generate_pdf.sh
#
# pdf.dir      Folder holding the PDF files to index. The generated index page is
#              written into this folder. Either an absolute path, or a path
#              relative to this properties file.
#
# output.file  Name of the generated index page, written inside pdf.dir.
#              Defaults to index_pdf.html when left unset. Do not set this to
#              index.html if generate_html.sh writes its index into the same
#              folder, or the two scripts will overwrite each other.
#
# Override the properties file location with the GENERATE_PDF_PROPERTIES env var.

pdf.dir=/opt_html
output.file=index_pdf.html
